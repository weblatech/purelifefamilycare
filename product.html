<!DOCTYPE html>

  <script>
    // Forward directly to index.html with product ID parameter
    const params = new URLSearchParams(window.location.search);

    window.location.replace('index.html?product=' + encodeURIComponent(prodId));
  </script>
</head>

    <p style="font-size: 14px; color: #555;">پروڈکٹ کی تفصیل لوڈ ہو رہی ہے، براہِ کرم چند لمحے انتظار فرمائیں...</p>

</body>
</html>
